<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choferes x Fase | Gestión de Transporte Soka Gakkai</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#2563eb"/>
  <style>
    @media (max-width: 700px){
      .pageTitle{ font-size: 24px; }
      #driversBox .row{ align-items:flex-start; }
      #driversBox label.row{ flex-direction:column; }
      #driversBox label.row > div{ min-width: auto !important; width:100%; }
      #driversBox input[type="checkbox"]{ width:22px; height:22px; }
    }
  </style>
</head>
<body>
 <header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="title">Gestión de Transporte Soka Gakkai</div>
      <div class="sub">Rosario / Gran Rosario</div>
    </div>

    <div class="topbar-center">
      <div class="field topbar-event-field">
        <label>Evento activo</label>
        <select id="eventSelect"></select>
        <div class="subtitle" id="eventHint">No hay evento seleccionado</div>
      </div>
    </div>

    <div class="row">
      <a href="index.html" class="iconbtn primary" title="Inicio">🏠</a>
      <div class="pill">
        <span id="authStatus">No ingresado</span>
        <button id="btnLogin" type="button" style="display:none">Ingresar</button>
        <button id="btnLogout" type="button" class="danger">Salir</button>
      </div>
    </div>
  </div>
</header>

  <main class="page">
    <div class="container">
      <div class="pageHead">
        <h1 class="pageTitle">Choferes x Fase</h1>
        <div class="pageSub">Disponibilidad de choferes por fase (Ida, Vuelta, etc.).</div>
      </div>

      <section class="card">
        <div class="row" style="justify-content:space-between; gap:12px; flex-wrap:wrap;">
          <div class="row" style="gap:10px; flex-wrap:wrap;">
            <div>
              <div class="label">Fase</div>
              <select id="phaseSelect" class="select"></select>
            </div>
            <div class="pill" id="phaseHint"></div>
          </div>

          <div class="row" style="gap:10px; flex-wrap:wrap;">
            <button class="btn" id="btnAllOn" type="button">Marcar todos</button>
            <button class="btn" id="btnAllOff" type="button">Desmarcar todos</button>
            <button class="btn primary" id="btnSave" type="button">Guardar</button>
          </div>
        </div>

        <div class="divider" style="margin:14px 0;"></div>

        <div id="driversBox" class="stack"></div>

        <div class="hint" style="margin-top:12px">
          Se guarda en: <code>events/&lt;eventId&gt;/eventDrivers/&lt;driverId&gt;.phases[phaseId]=true|false</code>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./choferes-x-fase.js"></script>
</body>
</html>
