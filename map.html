<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mapa · Logística Jóvenes</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>
  
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="title">Logística Jóvenes</div>
      <div class="sub">Rosario / Gran Rosario</div>
    </div>
    <div class="pill" id="userPill">
      <span id="authStatus">No ingresado</span>
      <button class="btn" id="btnLogin" type="button" style="margin-left:10px">Ingresar</button>
    </div>
  </div>
</header>


  <main class="container">
    <section class="card">
      <div class="row">
        <div class="muted" id="eventHint"></div>
        <button id="btnRefreshMap" class="btnSecondary">Redibujar</button>
      </div>
      <div id="map" style="height:70vh;border-radius:12px;overflow:hidden;"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./map.js"></script>

<script type="module" src="./firebase-init.js"></script>
<script type="module" src="./core.js"></script>

</body>
</html>
