<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa — Gestión de Transporte</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./map.js?v=phase1" defer></script>
</head>
<body>
  <div id="appHeader"></div>
  <div class="container">
    <div class="card">
      <h2>🗺️ Mapa</h2>
      <div class="row">
        <span class="pill">Mostrar</span>
        <select id="mapFilter">
          <option value="all">Todos</option>
          <option value="drivers">Solo choferes</option>
          <option value="passengers">Solo pasajeros</option>
        </select>
        <span id="mapHint" class="muted small"></span>
      </div>
      <div class="hr"></div>
      <div id="map" style="height:520px; border-radius:18px; border:1px solid rgba(255,255,255,.10); overflow:hidden;"></div>
    </div>
  </div>
</body>
</html>
