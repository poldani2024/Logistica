<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Solicitudes (Admin)</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
 <header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="title">Gestión de Transporte Soka Gakkai</div>
      <div class="sub">Rosario / Gran Rosario</div>
    </div>

    <div class="topbar-center">
      <div class="field" style="min-width:min(620px, 48vw);">
        <label>Evento activo</label>
        <select id="eventSelect"></select>
        <div class="subtitle" id="eventHint">No hay evento seleccionado</div>
      </div>
    </div>

    <div class="row">
      <a href="index.html" class="iconbtn primary" title="Inicio">🏠</a>
      <div class="pill">
        <span id="authStatus">No ingresado</span>
        <button id="btnLogin" type="button" style="display:none">Ingresar</button>
        <button id="btnLogout" type="button" class="danger">Salir</button>
      </div>
    </div>
  </div>
</header>

  <main class="container">
    <div id="eventHint" class="muted"></div>

    <section class="card">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">Solicitudes</h2>
        <div class="row" style="gap:8px; align-items:center;">
          <label class="muted">Estado</label>
          <select id="selRqStatus" class="select">
            <option value="open">open</option>
            <option value="review">review</option>
            <option value="converted">converted</option>
            <option value="rejected">rejected</option>
            <option value="all">all</option>
          </select>
          <button id="btnRefresh" class="btnSecondary">Actualizar</button>
        </div>
      </div>

      <div id="rqList"></div>
    </section>

    <section class="card">
      <h2>Detalle</h2>
      <div id="rqDetail" class="muted">Seleccioná una solicitud…</div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="./requests_admin.js"></script>
</body>
</html>
