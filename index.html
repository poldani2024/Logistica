<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Transporte Soka Gakkai</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="title">Gestión de Transporte Soka Gakkai</div>
      <div class="sub">Rosario / Gran Rosario</div>
    </div>

    <div class="topbar-center">
      <div class="field" style="min-width:min(620px, 48vw);">
        <label>Evento activo</label>
        <select id="eventSelect"></select>
        <div class="subtitle" id="eventHint">No hay evento seleccionado</div>
      </div>
    </div>

    <div class="row">
      <a href="index.html" class="iconbtn primary" title="Inicio">🏠</a>

      <div class="pill">
        <span id="authStatus">No ingresado</span>
        <button id="btnLogin" type="button" style="display:none">Ingresar</button>
        <button id="btnLogout" type="button">Salir</button>
      </div>
    </div>
  </div>
</header>

<main class="container">

  <div id="homeStatus"></div>

  <h2>Inicio</h2>
  <p>Seleccioná una sección:</p>

  <div class="menu">
    <a href="events.html" data-perm="Eventos">Eventos</a>
    <a href="requests.html" data-perm="Solicitudes">Solicitudes</a>
    <a href="requests_admin.html" data-perm="Admin.Solicitudes">Adm. Solicitudes</a>
    <a href="drivers.html" data-perm="Choferes">Choferes</a>
    <a href="passengers.html" data-perm="Pasajeros">Pasajeros</a>
    <a href="choferes-x-fase.html" data-perm="ChoferesXFase">Choferes x Fase</a>
    <a href="assignments.html" data-perm="Asignaciones">Asignaciones</a>
    <a href="tracking.html" data-perm="Tracking">Tracking</a>
    <a href="map.html" data-perm="Mapa">Mapa</a>
    <a href="users_admin.html" data-perm="Permisos">Permisos</a>
  </div>

</main>

<script type="module">
  import { initCorePage, STATE, $, can } from "./core.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-auth.js";
  import { auth } from "./firebase-init.js";

  await initCorePage({ page: "home" });

  const loginBtn = $("btnLogin");
  const logoutBtn = $("btnLogout");
  const status = $("authStatus");

  function refreshAuthUI() {
    const u = STATE.auth.user;

    if (u) {
      status.textContent = u.email +
        (STATE.auth.isAdmin ? " (Admin)" : "") +
        (STATE.auth.isActive === false ? " (Inactivo)" : "");
      loginBtn.style.display = "none";
      logoutBtn.style.display = "inline-block";
    } else {
      status.textContent = "No ingresado";
      loginBtn.style.display = "inline-block";
      logoutBtn.style.display = "none";
    }
  }

  function applyPermissions(){
    document.querySelectorAll("[data-perm]").forEach(el => {
      const key = el.dataset.perm;
      el.style.display = can(key) ? "" : "none";
    });
  }

  onAuthStateChanged(auth, async () => {
    refreshAuthUI();
    applyPermissions();
  });

</script>

</body>
</html>
