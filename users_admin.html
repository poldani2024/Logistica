<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Usuarios y Permisos</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
 <header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="title">Gestión de Transporte Soka Gakkai</div>
      <div class="sub">Rosario / Gran Rosario</div>
    </div>


    <div class="row">
      <a href="index.html" class="iconbtn primary" title="Inicio">🏠</a>
      <div class="pill">
        <span id="authStatus">No ingresado</span>
        <button id="btnLogin" type="button" style="display:none">Ingresar</button>
        <button id="btnLogout" type="button" class="danger">Salir</button>
      </div>
    </div>
  </div>
</header>
  <main class="container">
    <section class="card">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">Usuarios</h2>
        <button id="btnRefresh" class="btnSecondary">Actualizar</button>
      </div>
      <div id="usersList"></div>
    </section>

    <section class="card">
      <h2>Detalle / Permisos</h2>
      <div id="userDetail" class="muted">Seleccioná un usuario…</div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script type="module" src="./users_admin.js"></script>
</body>
</html>
