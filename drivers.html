<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Choferes (Master) · Logística Jóvenes</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="btnSecondary" href="./index.html">← Home</a>

    <div style="flex:1"></div>

    <div class="row">
      <select id="eventSelect" class="select"></select>
      <button id="btnReloadEvents" class="btnSecondary">Recargar</button>
    </div>

    <div class="authBox">
      <div id="authStatus" class="muted"></div>
      <div class="authBtns">
        <button id="btnLogin" class="btnPrimary">Ingresar</button>
        <button id="btnLogout" class="btnSecondary">Salir</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="row">
        <input id="driverSearch" placeholder="Buscar…" />
        <button id="btnNewDriver" class="btnPrimary">Nuevo</button>
        <button id="btnReloadDrivers" class="btnSecondary">Recargar</button>
      </div>
      <div id="driversTable"></div>
    </section>

    <section class="card">
      <h2>Detalle</h2>
      <div id="driverDetail" class="muted">Seleccioná un chofer…</div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="./drivers.js"></script>
</body>
</html>
