<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choferes — Gestión de Transporte</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="module" src="./drivers.js" defer></script>
</head>
<body>
  <div id="appHeader"></div>
  <div class="container">
    <div class="card">
      <h2>🚗 Choferes (Master Data)</h2>
      <p class="muted">Alta / edición / baja. La disponibilidad por fase se gestiona en Eventos.</p>

        <input id="driverName" placeholder="Nombre" style="flex:1 1 auto; min-width:220px;">

      </div>

      <div class="hr"></div>
      <div id="driversTable" class="muted">Cargando…</div>
    </div>
  </div>
