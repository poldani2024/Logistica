<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pasajeros — Gestión de Transporte</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="module" src="./passengers.js" defer></script>
</head>
<body>
  <div id="appHeader"></div>
  <div class="container">
    <div class="card">
      <h2>👤 Pasajeros (Master Data)</h2>
      <p class="muted">Alta / edición. Geocodificación con Nominatim.</p>
      <div class="hr"></div>

      <div class="row">
        <input id="pName" placeholder="Nombre" style="flex:1 1 auto; min-width:220px;">
        <input id="pAddress" placeholder="Dirección (ej: España 1447, Rosario)" style="flex:2 1 auto; min-width:280px;">
        <button id="btnGeo" class="btn-primary">Geocodificar</button>
        <button id="btnAddP" class="btn-primary">Agregar</button>
      </div>

      <div class="hr"></div>

      <div class="split">
        <div>
          <h3>Log de geocodificación</h3>
          <div class="row">
            <button id="btnCopyLog">Copiar</button>
            <button id="btnClearLog" class="btn-danger">Limpiar</button>
          </div>
          <textarea id="geoLog" rows="10" style="width:100%; margin-top:10px;" readonly></textarea>
        </div>
        <div>
          <h3>Listado</h3>
          <div id="passengersTable" class="muted">Cargando…</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
