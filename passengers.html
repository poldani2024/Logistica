<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pasajeros · Gestión de Transporte Soka Gakkai</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="title">Gestión de Transporte Soka Gakkai</div>
      <div class="sub">Rosario / Gran Rosario</div>
    </div>

    <div class="topbar-center">
      <div class="field" style="min-width:min(620px, 48vw);">
        <label>Evento activo</label>
        <select id="eventSelect"></select>
        <div class="subtitle" id="eventHint">No hay evento seleccionado</div>
      </div>
    </div>

    <div class="row">
      <a href="index.html" class="iconbtn primary" title="Inicio">🏠</a>
      <div class="pill">
        <span id="authStatus">No ingresado</span>
        <button id="btnLogin" type="button" style="display:none">Ingresar</button>
        <button id="btnLogout" type="button" class="danger">Salir</button>
      </div>
    </div>
  </div>
</header>

<main class="container">
  <div class="grid cols-2">
    <section class="card">
      <div class="rowBetween">
        <div>
          <div class="cardTitle">Pasajeros</div>
          <div class="subtitle">Master data (la asignación es por evento)</div>
        </div>
        <div class="row" style="flex-wrap:wrap;">
          <button class="btn primary" id="btnAddPassenger">+ Nuevo</button>
          <button class="btn" id="btnGeocodeMissing" title="Geocodificar pasajeros sin lat/lng">📍 Geocodificar</button>
          <button class="btn" id="btnReloadPassengers" title="Recargar">↻</button>
        </div>
      </div>

      <div class="row" style="margin-top:12px;">
        <input id="passSearch" placeholder="Buscar por nombre, teléfono, dirección…" />
      </div>

      <div class="desktop-only" style="margin-top:12px;">
        <div class="tableWrap">
          <table>
            <thead><tr><th>Pasajero</th><th>Localidad</th><th>Tel</th><th>Geo</th><th></th></tr></thead>
            <tbody id="passengersTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="mobile-only" style="margin-top:12px;">
        <div class="cards-list" id="passengersCards"></div>
      </div>
    </section>

    <section class="card">
      <div class="rowBetween">
        <div>
          <div class="cardTitle">Detalle</div>
          <div class="subtitle" id="detailMode">Seleccioná un pasajero…</div>
        </div>
        <button class="btnDanger" id="btnDeletePassenger" style="display:none;">Eliminar</button>
      </div>

      <div id="passengerDetail" style="margin-top:12px;" class="muted">
        Seleccioná un pasajero o tocá <strong>+ Nuevo</strong>.
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module" src="./passengers.js"></script>
</body>
</html>
