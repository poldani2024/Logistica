<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pasajeros (Master) · Logística Jóvenes</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="title">Logística Jóvenes</div>
      <div class="sub">Rosario / Gran Rosario</div>
    </div>
    <div class="pill" id="userPill">
      <span id="authStatus">No ingresado</span>
      <button class="btn" id="btnLogin" type="button" style="margin-left:10px">Ingresar</button>
    </div>
  </div>
</header>


  <main class="container">
    <section class="card">
      <div class="row">
        <input id="passSearch" placeholder="Buscar…" />
        <button id="btnReloadPassengers" class="btnSecondary">Recargar</button>
      </div>
      <div id="passengersTable"></div>
    </section>

    <section class="card">
      <h2>Detalle</h2>
      <div id="passengerDetail" class="muted">Seleccioná un pasajero…</div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="./passengers.js"></script>

<script type="module" src="./firebase-init.js"></script>
<script type="module" src="./core.js"></script>

</body>
</html>
