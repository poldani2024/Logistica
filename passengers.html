<!doctype html>
<html lang="es">

<body>
  
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="title">Gestión de Transporte Soka Gakkai</div>
      <div class="sub">Rosario / Gran Rosario</div>
    </div>

    <div class="topbar-center">
      <div class="field" style="min-width:min(620px, 48vw);">
        <label>Evento activo</label>
        <select id="eventSelect"></select>
        <div class="subtitle" id="eventHint">No hay evento seleccionado</div>
      </div>
    </div>

    <div class="row">
      <a href="index.html" class="iconbtn primary" title="Inicio">🏠</a>
      <div class="pill">
        <span id="authStatus">No ingresado</span>
        <button id="btnLogin" type="button" style="display:none">Ingresar</button>
        <button id="btnLogout" type="button" class="danger">Salir</button>
      </div>
    </div>
  </div>
</header>


  <main class="container">
    <section class="card">
      <div class="row">
        <input id="passSearch" placeholder="Buscar…" />
        <button id="btnReloadPassengers" class="btnSecondary">Recargar</button>
      </div>
      <div id="passengersTable"></div>
    </section>

    <section class="card">
      <h2>Detalle</h2>
      <div id="passengerDetail" class="muted">Seleccioná un pasajero…</div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="./passengers.js"></script>

<script type="module" src="./firebase-init.js"></script>
<script type="module" src="./core.js"></script>

</body>
</html>
