<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Solicitudes</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#2563eb"/>
</head>
<body>
  <header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="title">Gestión de Transporte Soka Gakkai</div>
      <div class="sub">Rosario / Gran Rosario</div>
    </div>

    <div class="row">
      <a href="index.html" class="iconbtn primary" title="Inicio">🏠</a>
      <div class="pill">
        <span id="authStatus">No ingresado</span>
        <button id="btnLogin" type="button" style="display:none">Ingresar</button>
        <button id="btnLogout" type="button" class="danger">Salir</button>
      </div>
    </div>
  </div>
</header>

  <main class="container">
    <div id="eventHint" class="muted"></div>

    <section class="card">
      <h2>Crear solicitud de viaje</h2>

      <div class="grid2">
        <div class="field">
          <label>Evento / Motivo</label>
          <input id="rq_title" class="input" placeholder="Ej: Zadankai / Reunión / Actividad..." />
        </div>
        <div class="field">
          <label>Fecha</label>
          <div class="row" style="gap:8px;">
            <input id="rq_date" type="text" class="input" placeholder="DD/MM/YYYY" inputmode="numeric" />
            <button id="btnPickRqDate" type="button" class="btn" title="Seleccionar fecha">📅</button>
            <input id="rq_date_picker" type="date" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;" tabindex="-1" />
          </div>
        </div>

        <div class="field">
          <label>Dirección destino</label>
          <input id="rq_destAddress" class="input" placeholder="Calle y número" />
        </div>
        <div class="field">
          <label>Ciudad destino</label>
          <input id="rq_destCity" class="input" placeholder="Rosario / San Lorenzo / ..." />
        </div>

        <div class="field">
          <label>Teléfono de contacto</label>
          <input id="rq_contactPhone" class="input" placeholder="341..." />
        </div>
        <div class="field">
          <label>Descripción</label>
          <input id="rq_desc" class="input" placeholder="Opcional" />
        </div>
      </div>

      <hr />

      <div class="grid2">
        <div class="card2">
          <div class="row" style="justify-content:space-between; align-items:center;">
            <h3 style="margin:0;">Ida</h3>
            <label class="row" style="gap:8px;">
              <input id="rq_ida_on" type="checkbox" checked />
              <span>Incluir</span>
            </label>
          </div>

          <div class="grid2">
            <div class="field">
              <label>Dirección salida / encuentro</label>
              <input id="rq_ida_pickupAddress" class="input" placeholder="Calle y número" />
            </div>
            <div class="field">
              <label>Ciudad</label>
              <input id="rq_ida_pickupCity" class="input" placeholder="Rosario / ..." />
            </div>
            <div class="field">
              <label>Fecha</label>
              <div class="row" style="gap:8px;">
                <input id="rq_ida_date" type="text" class="input" placeholder="DD/MM/YYYY" inputmode="numeric" />
                <button id="btnPickRqIdaDate" type="button" class="btn" title="Seleccionar fecha Ida">📅</button>
                <input id="rq_ida_date_picker" type="date" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;" tabindex="-1" />
              </div>
            </div>
            <div class="field">
              <label>Hora</label>
              <input id="rq_ida_time" type="time" class="input" />
            </div>
          </div>
        </div>

        <div class="card2">
          <div class="row" style="justify-content:space-between; align-items:center;">
            <h3 style="margin:0;">Vuelta</h3>
            <label class="row" style="gap:8px;">
              <input id="rq_vuelta_on" type="checkbox" />
              <span>Incluir</span>
            </label>
          </div>

          <div class="grid2">
            <div class="field">
              <label>Dirección regreso</label>
              <input id="rq_vuelta_dropoffAddress" class="input" placeholder="Calle y número" />
            </div>
            <div class="field">
              <label>Ciudad</label>
              <input id="rq_vuelta_dropoffCity" class="input" placeholder="Rosario / ..." />
            </div>
            <div class="field">
              <label>Fecha</label>
              <div class="row" style="gap:8px;">
                <input id="rq_vuelta_date" type="text" class="input" placeholder="DD/MM/YYYY" inputmode="numeric" />
                <button id="btnPickRqVueltaDate" type="button" class="btn" title="Seleccionar fecha Vuelta">📅</button>
                <input id="rq_vuelta_date_picker" type="date" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;" tabindex="-1" />
              </div>
            </div>
            <div class="field">
              <label>Hora</label>
              <input id="rq_vuelta_time" type="time" class="input" />
            </div>
          </div>

          <label class="row" style="gap:8px;">
            <input id="rq_vuelta_same" type="checkbox" />
            <span>Usar misma dirección de ida</span>
          </label>
        </div>
      </div>

      <hr />

      <section>
        <div class="row" style="justify-content:space-between; align-items:center;">
          <h3 style="margin:0;">Pasajeros</h3>
          <button id="btnAddPassenger" class="btnSecondary">+ Agregar pasajero</button>
        </div>
        <div id="passengersBox"></div>
      </section>

      <div class="row" style="justify-content:flex-end; gap:10px; margin-top:12px;">
        <button id="btnCreateRequest" class="btnPrimary">Enviar solicitud</button>
      </div>
    </section>

    <section class="card">
      <h2>Mis solicitudes</h2>
      <div id="myRequests"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="./requests.js"></script>
</body>
</html>
