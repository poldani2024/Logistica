<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Asignaciones · Gestión de Transporte Soka Gakkai</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* Modal simple para asignar pasajeros */
    .modalOverlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 100;
    }
    .modalOverlay.show{ display:flex; }
    .modal{
      width:min(820px, 100%);
      max-height: min(80vh, 720px);
      overflow:auto;
    }
    .pillSmall{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:999px;
      background: rgba(255,255,255,.04);
      color: rgba(234,241,255,.72);
      font-size: 12px;
      white-space: nowrap;
    }
    .driverHead{
      display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    }
    .passRow{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 10px;
      border:1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      background: rgba(255,255,255,.03);
      margin-top: 10px;
    }
    .passRow:first-child{ margin-top: 0; }
    .passMeta{ display:flex; flex-direction:column; gap:2px; }
    .passName{ font-weight: 750; }
    .passSub{ font-size: 12px; color: rgba(234,241,255,.62); }
    .emptyBox{
      border:1px dashed rgba(255,255,255,.14);
      border-radius: 14px;
      padding: 12px;
      color: rgba(234,241,255,.62);
      background: rgba(255,255,255,.02);
    }
    @media (max-width: 620px){
      .driverHead{ flex-direction:column; align-items:stretch; }
      .modal{ max-height: 82vh; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="title">Gestión de Transporte Soka Gakkai</div>
      <div class="sub">Rosario / Gran Rosario</div>
    </div>

    <div class="topbar-center">
      <div class="field" style="min-width:min(620px, 48vw);">
        <label>Evento activo</label>
        <select id="eventSelect"></select>
        <div class="subtitle" id="eventHint">No hay evento seleccionado</div>
      </div>
    </div>

    <div class="row">
      <a href="index.html" class="iconbtn primary" title="Inicio">🏠</a>
      <div class="pill">
        <span id="authStatus">No ingresado</span>
        <button id="btnLogin" type="button" style="display:none">Ingresar</button>
        <button id="btnLogout" type="button" class="danger">Salir</button>
      </div>
    </div>
  </div>
</header>

<main class="container">
  <div class="rowBetween" style="margin-bottom:12px;">
    <div>
      <h2 style="margin:0;">Asignaciones</h2>
      <div class="subtitle">Asigná pasajeros desde cada chofer (más ágil)</div>
    </div>
    <div class="row">
      <button class="btn" id="btnReloadContext" title="Recargar">↻</button>
    </div>
  </div>

  <div class="cards-list" id="driversBoard"></div>
</main>

<!-- Modal: agregar pasajero a chofer -->
<div class="modalOverlay" id="assignModal">
  <div class="card modal">
    <div class="rowBetween">
      <div>
        <div class="cardTitle" id="modalTitle">Agregar pasajero</div>
        <div class="subtitle" id="modalSub">Seleccioná un pasajero pendiente…</div>
      </div>
      <button class="btn" id="btnCloseModal">Cerrar</button>
    </div>

    <div class="row" style="margin-top:12px;">
      <input id="modalSearch" placeholder="Buscar pasajero por nombre / teléfono / dirección…" />
    </div>

    <div style="margin-top:12px;" id="modalList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="./assignments.js"></script>
</body>
</html>
