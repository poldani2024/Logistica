<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asignaciones — Gestión de Transporte</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="module" src="./assignments.js?v=phase1" defer></script>
</head>
<body>
  <div id="appHeader"></div>

  <div class="container">
    <div class="card">
      <h2>🧩 Asignaciones (por fase)</h2>
      <p class="muted">Elegí una fase y asigná pasajeros a choferes disponibles en esa fase.</p>
      <div class="hr"></div>

      <div class="row">
        <span class="pill">Fase</span>
        <select id="phaseSelect"></select>
        <span id="phaseHint" class="muted small"></span>
      </div>
    </div>

    <div class="split" style="margin-top:14px;">
      <div class="card">
        <h3>🚗 Choferes disponibles</h3>
        <div id="driversBox" class="muted">Seleccioná evento y fase…</div>
      </div>

      <div class="card">
        <h3>👤 Pasajeros pendientes</h3>
        <div id="passengersBox" class="muted">Seleccioná evento y fase…</div>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <h3>📌 Asignación por chofer</h3>
      <div id="assignmentBox" class="muted">Seleccioná un chofer.</div>
    </div>
  </div>
</body>
</html>
