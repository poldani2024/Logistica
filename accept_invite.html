<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aceptar invitación</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial; margin:0; padding:24px; background:#0b1220; color:#e8eefc;}
    .card{max-width:720px; margin:0 auto; background:#121a2b; border:1px solid #25304a; border-radius:14px; padding:18px;}
    h1{font-size:20px; margin:0 0 10px;}
    p{margin:8px 0; color:#b9c4de;}
    .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
    button,a.btn{cursor:pointer; border:0; border-radius:10px; padding:10px 12px; font-weight:600;}
    button.primary{background:#4f7cff; color:#081022;}
    button.ghost{background:transparent; color:#e8eefc; border:1px solid #2c3a5d;}
    pre{white-space:pre-wrap; background:#0a1020; border:1px solid #25304a; padding:10px; border-radius:10px; color:#d5ddf5;}
    .ok{color:#8cffb0;}
    .err{color:#ff8c8c;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Aceptar invitación</h1>
    <p id="status">Verificando…</p>
    <pre id="detail" style="display:none"></pre>

    <div class="row" id="actions" style="display:none">
      <a class="btn ghost" href="./index.html">Volver</a>
      <button class="primary" id="btnLogin">Iniciar sesión</button>
    </div>
  </div>

  <script type="module" src="./accept_invite.js"></script>
</body>
</html>
