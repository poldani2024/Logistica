<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tracking · Logística Soka</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#2563eb"/>
  <style>
    /* Tracking: mejorar contraste de selects */
    select.select, .select {
      background: #fff;
      color: #111;
      border: 1px solid rgba(0,0,0,.2);
    }
    select.select option { color:#111; }

    @media (max-width: 700px){
      #trackingBox .card{ padding:12px; }
      #trackingBox .row{ flex-wrap:wrap; align-items:flex-start; }
      #trackingBox .btn, #trackingBox button{ width:100%; }
    }
  </style>
</head>
<body>
 <header class="topbar">
  <div class="topbar-inner">
    <!-- Izquierda: Marca -->
    <div class="brand">
      <div class="title">Gestión de Transporte Soka Gakkai</div>
      <div class="sub">Rosario / Gran Rosario</div>
    </div>

    <!-- Centro: Evento activo -->
    <div class="topbar-center">
      <div class="field topbar-event-field">
        <label>Evento activo</label>

        <!-- Si la página tiene selector, dejá este <select>. Si NO, lo podés borrar y dejar solo el span -->
        <select id="eventSelect"></select>

        <!-- Siempre presente: muestra el texto del evento activo -->
        <div class="subtitle" id="eventHint">No hay evento seleccionado</div>
      </div>
    </div>

    <!-- Derecha: Home + Usuario + Salir -->
    <div class="row">
      <a href="index.html" class="iconbtn primary" title="Inicio">🏠</a>

      <div class="pill">
        <span id="authStatus">No ingresado</span>
        <button id="btnLogin" type="button" style="display:none">Ingresar</button>
        <button id="btnLogout" type="button">Salir</button>
      </div>
    </div>
  </div>
</header>
  <main class="container">
    <div class="row" style="justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
      <h1 style="margin: 18px 0;">Tracking</h1>
      <div id="trackingPageHint" class="muted"></div>
    </div>

    <div id="trackingBox"></div>
  </main>

  <div id="toast" class="toast" ></div>

  <script type="module" src="./tracking.js"></script>
</body>
</html>
