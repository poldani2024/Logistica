<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eventos — Gestión de Transporte</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="module" src="./events.js?v=phase1" defer></script>
</head>
<body>
  <div id="appHeader"></div>
  <div class="container">
    <div class="grid">
      <div class="card">
        <h2>📅 Eventos</h2>
        <p class="muted">Creá eventos y definí fases (Ida/Vuelta o las que necesites).</p>
        <div class="hr"></div>

        <div class="split">
          <div>
            <h3>Crear evento</h3>
            <div class="row">
              <input id="newEventTitle" placeholder="Título (ej: Coro Kaneko a BsAs)" style="flex:1 1 auto; min-width:240px;" />
              <input id="newEventStart" type="date" />
              <input id="newEventEnd" type="date" />
              <button id="btnCreateEvent" class="btn-primary">Crear</button>
            </div>
            <p class="small muted">Se guardan en <span class="kbd">events</span>. Después elegí el evento arriba para trabajar por evento.</p>
          </div>

          <div>
            <h3>Fases del evento activo</h3>
            <div class="row">
              <input id="phaseId" placeholder="id (ej: ida)" />
              <input id="phaseName" placeholder="Nombre (ej: Ida)" />
              <button id="btnAddPhase" class="btn-primary">Agregar fase</button>
              <button id="btnAddIdaVuelta">Crear Ida/Vuelta</button>
              <button id="btnSavePhases" class="btn-primary">Guardar fases</button>
            </div>
            <div id="phasesList" class="small muted" style="margin-top:10px;"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>🚗 Disponibilidad de choferes por fase</h3>
        <p class="muted small">Checkbox por chofer × fase (persistencia inmediata).</p>
        <div id="driversPhaseGrid" class="muted">Cargando…</div>
      </div>
    </div>
  </div>
</body>
</html>
