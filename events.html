<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eventos · Logística Jóvenes</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="btnSecondary" href="./index.html">← Home</a>

    <div style="flex:1"></div>

    <div class="row">
      <select id="eventSelect" class="select"></select>
      <button id="btnReloadEvents" class="btnSecondary">Recargar</button>
    </div>

    <div class="authBox">
      <div id="authStatus" class="muted"></div>
      <div class="authBtns">
        <button id="btnLogin" class="btnPrimary">Ingresar</button>
        <button id="btnLogout" class="btnSecondary">Salir</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Alta / Edición de Evento</h2>

      <div class="grid2">
        <div class="field">
          <label>ID del evento (ej: 2026-03-ZADANKAI)</label>
          <input id="ev_id" placeholder="ID único (no vacío)" />
        </div>

        <div class="field">
          <label>Nombre</label>
          <input id="ev_name" placeholder="Nombre identificable" />
        </div>

        <div class="field">
          <label>Fecha inicio</label>
          <input id="ev_start" type="datetime-local" />
        </div>

        <div class="field">
          <label>Fecha fin</label>
          <input id="ev_end" type="datetime-local" />
        </div>

        <div class="field">
          <label>Domicilio</label>
          <input id="ev_address" placeholder="Dirección del evento" />
        </div>

        <div class="field">
          <label>Localidad</label>
          <input id="ev_localidad" placeholder="Rosario / Funes / ..." />
        </div>
      </div>

      <div class="row">
        <button id="btnSaveEvent" class="btnPrimary">Guardar Evento</button>
        <button id="btnLoadFromSelected" class="btnSecondary">Cargar desde seleccionado</button>
      </div>

      <div class="muted" id="eventHint"></div>
    </section>

    <section class="card">
      <h2>Asociar Choferes y Pasajeros al Evento (histórico)</h2>
      <p class="muted">Esto define el “universo” del evento. La asignación chofer↔pasajero se hace en “Asignaciones”.</p>

      <div class="grid2">
        <div>
          <h3>Choferes</h3>
          <div class="row">
            <input id="driverSearch" placeholder="Buscar chofer…" />
            <button id="btnLinkAllDrivers" class="btnSecondary">Vincular seleccionados</button>
            <button id="btnUnlinkAllDrivers" class="btnSecondary">Desvincular seleccionados</button>
          </div>
          <div id="driversList"></div>
        </div>

        <div>
          <h3>Pasajeros</h3>
          <div class="row">
            <input id="passSearch" placeholder="Buscar pasajero…" />
            <button id="btnLinkAllPassengers" class="btnSecondary">Vincular seleccionados</button>
            <button id="btnUnlinkAllPassengers" class="btnSecondary">Desvincular seleccionados</button>
          </div>
          <div id="passengersList"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="./events.js"></script>
</body>
</html>
