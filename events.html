<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eventos · Logística Jóvenes</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="title">Logística Jóvenes</div>
      <div class="subtitle">Rosario / Gran Rosario</div>
    </div>

    <div class="row grow">
      <div class="grow">
        <label>Evento activo</label>
        <select id="eventSelect"></select>
      </div>
    </div>

    <div class="row">
      <button class="btn" id="btnHome">🏠</button>
      <button class="btn danger" id="btnLogout">Salir</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="grid cols-2">
    <div class="card">
      <div style="display:flex; justify-content:space-between; gap:10px; align-items:center;">
        <div>
          <div style="font-weight:800; font-size:18px;">Choferes</div>
          <div style="color:var(--muted); font-size:13px;">Master data</div>
        </div>
        <button class="btn primary" id="btnAddDriver">+ Agregar</button>
      </div>
      <!-- tabla desktop -->
      <div class="desktop-only" style="margin-top:12px;">
        <table class="table" id="driversTable"></table>
      </div>
      <!-- cards mobile -->
      <div class="mobile-only" style="margin-top:12px;">
        <div class="cards-list" id="driversCards"></div>
      </div>
    </div>

    <div class="card">
      <!-- otra columna -->
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>


  <main class="container">
    <section class="card">
      <h2>Alta / Edición de Evento</h2>

      <div class="grid2">
        <div class="field">
          <label>ID del evento (ej: 2026-03-ZADANKAI)</label>
          <input id="ev_id" placeholder="ID único (no vacío)" />
        </div>

        <div class="field">
          <label>Nombre</label>
          <input id="ev_name" placeholder="Nombre identificable" />
        </div>

        <div class="field">
          <label>Fecha inicio</label>
          <input id="ev_start" type="datetime-local" />
        </div>

        <div class="field">
          <label>Fecha fin</label>
          <input id="ev_end" type="datetime-local" />
        </div>

        <div class="field">
          <label>Domicilio</label>
          <input id="ev_address" placeholder="Dirección del evento" />
        </div>

        <div class="field">
          <label>Localidad</label>
          <input id="ev_localidad" placeholder="Rosario / Funes / ..." />
        </div>
      </div>

      <div class="row">
        <button id="btnSaveEvent" class="btnPrimary">Guardar Evento</button>
        <button id="btnLoadFromSelected" class="btnSecondary">Cargar desde seleccionado</button>
      </div>

      <div class="muted" id="eventHint"></div>
    </section>

    <section class="card">
      <h2>Asociar Choferes y Pasajeros al Evento (histórico)</h2>
      <p class="muted">Esto define el “universo” del evento. La asignación chofer↔pasajero se hace en “Asignaciones”.</p>

      <div class="grid2">
        <div>
          <h3>Choferes</h3>
          <div class="row">
            <input id="driverSearch" placeholder="Buscar chofer…" />
            <button id="btnLinkAllDrivers" class="btnSecondary">Vincular seleccionados</button>
            <button id="btnUnlinkAllDrivers" class="btnSecondary">Desvincular seleccionados</button>
          </div>
          <div id="driversList"></div>
        </div>

        <div>
          <h3>Pasajeros</h3>
          <div class="row">
            <input id="passSearch" placeholder="Buscar pasajero…" />
            <button id="btnLinkAllPassengers" class="btnSecondary">Vincular seleccionados</button>
            <button id="btnUnlinkAllPassengers" class="btnSecondary">Desvincular seleccionados</button>
          </div>
          <div id="passengersList"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="firebase-init.js"></script>
  <script src="core.js"></script>
  <script src="events.js"></script>
</body>
</html>
